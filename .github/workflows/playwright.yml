name: Playwright checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # The official image contains Chromium, Firefox, WebKit, and their system dependencies.
      # GitHub Actions pulls this image before running the job steps, so no browser install step is needed.
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run build

      - name: Run Playwright tests
        run: npx playwright test
        env:
          LOAN_USERNAME: ${{ secrets.LOAN_USERNAME }}
          LOAN_PASSWORD: ${{ secrets.LOAN_PASSWORD }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
